<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Registro Usuario</title>
        <link rel="stylesheet" href='{{ url_for("static", filename="css/style.css") }}'>
        <script src='{{ url_for("static", filename="js/captcha.js") }}'></script>
    </head>
<style> .container {
    display: flex;
    justify-content: center;
    flex-direction: column;
    align-items: center;
  }
  
  .box {
    /* background-color: #f1f2f2; */
    display: flex;
    flex-direction: column;
    justify-content: space-around;
    border-radius: 5px;
    padding: 20px;
  }
  
  .captcha {
    font-family: "Comic Sans MS", cursive, sans-serif;
    font-style: italic;
    font-weight: bold;
    font-size: 2em;
    padding: 3px;
    border-radius: 5px;
    text-decoration: line-through;
    /* color: #a0a0a0; */
  }
  
  .restart a {
    text-decoration: none;
  }
  

    .button1{
    background-color: rgba(255, 255, 255, 0.1);
    border: none;
    border-radius: 30px;
    color: white;
    cursor: pointer;
    font-size: 16px;
    font-weight: bold;
    font-family: 'Mulish', sans-serif;
    letter-spacing: 3px;
    width: 90%;
    height: 40px;
    margin: 11px 0px;}
  </style>
    <body>
      <header class="header">
        <img class="header__img" src='{{ url_for("static", filename="media/icons8-aeropuerto-100.png") }}' alt="Logo" />
        <div>
            <h2 class="header__title"><a href="/home/">Aeropuerto Matecaña Internacional</a> </h2>
            <a href="/home/">Regresar</a>
        </div> 
    </header>

        <section class="login">
            <section class="login__container">
                    <h2>Crea tu Usuario</h2>
                    <h2 class="errmsg">{{error}}</h2>
                    <form action="/registro/" method="post">
                        <input class="input" type="text" name="nombre" placeholder="Nombre" required/>
                        <input class="input" type="text" name="apellido" placeholder="Apellidos" required/>
                        <p>Tipo de Documento</p>
                        <select class="select" name="tipo">
                            <option>CC</option>
                            <option>TI</option>
                            <option>CE</option>
                            <option>PASAPORTE</option>
                            </select>
                        <input class="input" type="text" name='documento' placeholder="Numero de Documento" required/>
                        <input class="input" type="email" name='email' placeholder="Correo Electronico" required/>
                        <input class="input" type="password" name="pwd" placeholder="Ingrese la Contraseña" required/>
                        <input class="input" type="password" name="pwd2" placeholder="Confirme la Contraseña" required/>
                        <div class="container">
                            <div id="captcha" class="captcha"></div>
                            <div class="restart">
                            </div>
                            <div class="input">
                              <input
                                type="text"
                                name="reCaptcha"
                                id="reCaptcha"
                                placeholder="Type The Captcha"
                              />
                            </div>
                              <div>
                                  <input type="button" class="button" value="Validar Captcha" onclick="validateCaptcha()" />
                                  <input class="button" type="button" value="Recargar" onclick="createCaptcha()" /> 
                          </div>
                            <div id="errCaptcha" class="errmsg"></div>
                              </div>
                              <div id="captcha" class="captcha"><script>createCaptcha();</script></div>
                              <div! class="restart">
                              
                              </div!>
                        <!--button class="button" value="Registame" onclick="validateCaptcha()"-->
                        <input class="button" type="submit" value="Registrarme"> 
                    </form>
                    <a href="/login/">Regresar</a>
                </section>
        </section>
        <footer class="footer">
          <a href="/terminos">Terminos y condiciones </a>
          <a href="/contactanos">Contactanos</a>
        </footer>
    </body>
</html>
