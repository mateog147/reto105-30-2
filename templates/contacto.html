<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contactanos</title>
    <link rel="stylesheet" href='{{ url_for("static", filename="css/style.css") }}'>
</head>
<body>
    <header class="header">
        <img class="header__img" src='{{ url_for("static", filename="media/icons8-aeropuerto-100.png") }}' alt="Logo" />
        <div>
            <h2 class="header__title"><a href="/home/">Aeropuerto Matecaña Internacional</a> </h2>
            <a href="/home/">Regresar</a>
        </div> 
    </header>
    <section class="login">
        <section class="login__container">
            <h2 class="login__title">Envía un mensaje</h2>
            <form class="login__container--form" action="/home/">
                <input class="input" type="text" placeholder="Nombre*" required/>
                <input class="input" type="text" placeholder="Telefono/Celular" required/>
                <input class="input" type="email" placeholder="Correo electronico*" required/>
                <input class="input" type="text" placeholder="Escriba su Mensaje" required/ style="height: 150px; text-align: start;">
                <button class="button">Enviar Mensaje</button>
            </form>
            
        </section>
    </section>
    <footer class="footer">
        <a href="/">Terminos y condiciones </a>
        <a href="/">Contactanos</a>
    </footer>
</body>
</html>
