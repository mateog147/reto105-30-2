<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contactanos</title>
    <link rel="stylesheet" href='{{ url_for("static", filename="css/style.css") }}'>
</head>
<body>
    <header class="header">
        <img class="header__img" src='{{ url_for("static", filename="media/icons8-aeropuerto-100.png") }}' alt="Logo" />
        <div>
            <h2 class="header__title"><a href="/home/">Aeropuerto Matecaña Internacional</a> </h2>
            <a href="/home/">Regresar</a>
        </div> 
    </header>
    <section class="login">
        <section class="login__container">
            <h2 class="login__title">Envía un mensaje</h2>
            <h2>{{error}}</h2>
            <form id="formulario" class="login__container--form" action="/contactanos/" method="post">
                <input class="input" type="text" placeholder="Nombre*" name="nombre" required/>
                <input class="input" type="text" placeholder="Telefono/Celular" name="telefono" required/>
                <input class="input" type="email" placeholder="Correo electronico*" name="email" required/>
                <input class="input" type="text" placeholder="Escriba su Mensaje" name="mensaje" required style="height: 150px; text-align: start;">
            </form>
            <button class="button" onclick="mensaje()">Enviar Mensaje</button>
            
        </section>
    </section>
    <footer class="footer">
        <a href="/">Terminos y condiciones </a>
        <a href="/">Contactanos</a>
    </footer>
    <script>
        function mensaje(){
            alert("Mensaje enviado");
            document.getElementById('formulario').submit();
        }
    </script>
</body>
</html>
