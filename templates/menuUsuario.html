<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu usuario Final</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Mulish:wght@200&display=swap" rel="stylesheet">
    <link rel="stylesheet" href='{{ url_for("static", filename="css/menu.css") }}'>
</head>

<body>
    <header class="header">
        <img class="header__img" src='{{ url_for("static", filename="media/icons8-aeropuerto-100.png") }}' alt="Logo" />
        <h2 class="header__title"><a href="/home/">Aeropuerto Matecaña Internacional</a> </h2>
    </header>

    <input type="text" id="mensaje" name="mensaje" value="{{mensaje}}" style="display: none;">
    <section class="menu">
        <section class="menu__container">
            <div class="menu__container--saludo">
                <h2 class="menu__title">Hola {{nombre}}</h2>
                <h2 class="menu__title">Que quieres hacer?</h2>
            </div>
            <form class="menu__container--form">
                <button class="button" formaction="/vervuelos">Buscar Vuelo por Codigo</button>
                <button class="button" formaction="/separavuelo/">Separa tu proximo viaje</button>
                <button class="button" formaction="/calificar/">Califica tu vuelo</button>
                <button class="button" formaction="/editarusuario/">Editar tu información</button>
            </form>
        </section>
    </section>
    <footer class="footer">
        <a href="/terminos">Terminos y condiciones </a>
        <a href="/contactanos">Contactanos</a>
    </footer>
    <script>
        let msg=document.getElementById("mensaje").value;
        if (msg!=null && msg!=undefined && msg!=" "){
            alert(msg);
        }
    </script>
</body>
</html>
