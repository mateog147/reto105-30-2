<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Formulario de contacto</title>

    <link rel="stylesheet" href="../static/css/estilos.css">
    <link rel="stylesheet" href="../static/css/style.css">
</head>
<body>
    <header class="header">
        <img class="header__img" src="../static/media/icons8-aeropuerto-100.png" alt="Logo" /> 
        <h2 class="header__title"><a href="/home/">Aeropuerto Matecaña Internacional</a> </h2>
    </header>
    <section class="form_wrapeditar">

        <form action="" class="form_contact">
            <h2>Edita o elimina el vuelo</h2>
            <div class="user_info">
                <label for="names">No. vuelo *</label>
                <input type="text" id="names">

                <label for="phone">Aerolinea</label>
                <input type="text" id="phone">

                <label for="email">Destino *</label>
                <input type="text" id="email">

                <label for="mensaje">Procedente *</label>
                <textarea id="mensaje"></textarea>

                <label for="mensaje">Hora salida *</label>
                <textarea id="mensaje"></textarea>

                <label for="mensaje">Hora llegada *</label>
                <textarea id="mensaje"></textarea>

                <label for="mensaje">Estado *</label>
                <textarea id="mensaje"></textarea>

                <div>        
                    <input class="EditarVuelo" type="button" value="Eliminar" id="btnSend">
                    <input class="EditarVuelo" type="button" value="Editar" id="btnSend">
                </div>
            </div>
        </form>

    </section>
    <footer class="footer" >
        <a href="/terminos">Terminos y condiciones </a>
        <a href="/contactanos">Contactanos</a>
      </footer>
</body>
</html>
