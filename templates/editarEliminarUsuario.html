<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Editar</title>

    <link rel="stylesheet" href='{{ url_for("static", filename="css/style.css") }}'>

</head>
<body>
    <header class="header">
        <img class="header__img" src='{{ url_for("static", filename="media/icons8-aeropuerto-100.png") }}' alt="Logo" />
        <div>
            <h2 class="header__title"><a href="/home/">Aeropuerto Matecaña Internacional</a> </h2>

            {% if session['perfil'] == 'U' %}
                <a href="/menu/">Regresar</a>
            {% endif %}
            {% if session['perfil'] == 'P' %}
            <a href="/mpiloto/">Regresar</a>
            {% endif %}
        </div> 
    </header>

    <section class="login">
        <section class="login__container">
                <h2>Edita tu información</h2>
                <h2 class="errmsg">{{error}}</h2>
                <form action="/editarusuario/" method="post">
                    <input class="input" type="text" name="nombre" value="{{nombre}}" required/>
                    <input class="input" type="text" name="apellido" value="{{apellido}}" required/>
                    <p>Tipo de Documento</p>
                    <select class="select" name="tipo">
                        <option>CC</option>
                        <option>TI</option>
                        <option>CE</option>
                        <option>PASAPORTE</option>
                        </select>
                    <input class="input" type="text" name='documento' value="{{cedula}}" required/>
                    <input class="input" type="email" name='email' value="{{correo}}" required/>
                    <!--button class="button" value="Registame" onclick="validateCaptcha()"-->
                    <input class="button" type="submit" value="Guardar"> 
                </form>

            </section>
    </section>
    <footer class="footer">
    <a href="/terminos">Terminos y condiciones </a>
    <a href="/contactanos">Contactanos</a>
    </footer>
</body>
</html>
