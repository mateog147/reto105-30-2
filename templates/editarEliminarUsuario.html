<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Formulario de contacto</title>

    <link rel="stylesheet" href='{{ url_for("static", filename="css/estilos.css") }}'>
    <link rel="stylesheet" href='{{ url_for("static", filename="css/style.css") }}'>

</head>
<body>
    <header class="header">
        <img class="header__img" src="../static/media/icons8-aeropuerto-100.png" alt="Logo" /> 
        <h2 class="header__title"><a href="/home/">Aeropuerto Matecaña Internacional</a> </h2>
    </header>
    <section class="form_wrapeditar">

        <form action="" class="form_contact">
            <h2>Edita o elimina tu usuario</h2>
            <div class="user_info">
                <label for="names">Nombres *</label>
                <input type="text" id="names">

                <label for="phone">Apellidos *</label>
                <input type="text" id="phone">

                <label for="email">Tipo de documento*</label>
                <input type="text" id="email">

                <label for="mensaje">Correo electronico *</label>
                <textarea id="mensaje"></textarea>

                <label for="mensaje">Nueva contraseña *</label>
                <textarea id="mensaje"></textarea>

                <label for="mensaje">Confirma nueva contraseña *</label>
                <textarea id="mensaje"></textarea>

                <div>        
                    <input class="EditarVuelo" type="button" value="Eliminar" id="btnSend">
                    <input class="EditarVuelo" type="button" value="Editar" id="btnSend">
                </div>
            </div>
        </form>

    </section>
    <footer class="footer" >
        <a href="/terminos">Terminos y condiciones </a>
        <a href="/contactanos">Contactanos</a>
      </footer>
</body>
</html>
