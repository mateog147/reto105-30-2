<!DOCTYPE html>
<html lang="es">
    <style>
        #myTable {

width: 100%;
font-size: 18px;
box-sizing: border-box;
}

#myTable td{
color: white;
border: 2px solid;
}
#myTable th, #myTable td {
text-align: left;
padding: 12px;
}


#myTable tr.header1, #myTable tr:hover {
background-color: #171f60;
}
.login__title
{
background-color: #171f60;
}

    </style>
    <head>
        <meta charset="UTF-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Registro de Vuelo</title>
        <link rel="stylesheet" href='{{ url_for("static", filename="css/style.css") }}'>
    </head>

    <body>
        <header class="header">
            <img class="header__img" src='{{ url_for("static", filename="static/media/icons8-aeropuerto-100.png") }}' alt="Logo" /> 
            <h2 class="header__title"><a href="/home/">Aeropuerto Matecaña Internacional</a> </h2>
        </header>
        <section class="login">
            <section class="login__container">
                    <center><h2>Separa tu Vuelo</h2></center>
                    <h2 class="errmsg">{{error}}</h2>
                    <form id="formulario" action="/separavuelo/" method="post">
                        <input type="text" name="codigo" id="codigo" style="display: none;">
                        <!--label for="">Ida y Vuelta<input type="checkbox" id="cbox1" value="first_checkbox"></!--label!-->
                        <div>
                            <span>Fecha del vuelo:</span>
                            <input name="fecha" type="date"  class="select" style="width: 170px;"/>
                        </div>
                        <div class="login__select" style="display: flex;">
                            <div>
                                <span style="width: 50%;">Origen</span>
                                <select class="select" name="origen" id="origen" style="width: 150px;">
                                    <option value="">-</option>
                                    <option value="Armenia-AXM">Armenia-AXM</option>
                                    <option value="Barranquilla-BAQ">Barranquilla-BAQ</option>
                                    <option value="Bogotá-BOG">Bogotá-BOG</option>
                                    <option value="Bucaramanga-BGA">Bucaramanga-BGA</option>
                                    <option value="Cali-CLO">Cali-CLO</option>
                                    <option value="Cartagena-CTG">Cartagena-CTG</option>
                                    <option value="Cúcuta-CUC">Cúcuta-CUC</option>
                                    <option value="Florencia-FLA">Florencia-FLA</option>
                                    <option value="Ibagué-IBE">Ibagué-IBE</option>
                                    <option value="Leticia-LET">Leticia-LET</option>
                                    <option value="Manizales-MZL">Manizales-MZL</option>
                                    <option value="Medellín-MDE">Medellín-MDE</option>
                                    <option value="Pereira-PEI">Pereira-PEI</option>
                                </select>
                            </div>
                            <div>
                                <span style="width: 50%;">Destino</span>
                                <select class="select" name="destino" id="destino" style="width: 150px;">
                                    <option value="">-</option>
                                    <option value="Armenia-AXM">Armenia-AXM</option>
                                    <option value="Barranquilla-BAQ">Barranquilla-BAQ</option>
                                    <option value="Bogotá-BOG">Bogotá-BOG</option>
                                    <option value="Bucaramanga-BGA">Bucaramanga-BGA</option>
                                    <option value="Cali-CLO">Cali-CLO</option>
                                    <option value="Cartagena-CTG">Cartagena-CTG</option>
                                    <option value="Cúcuta-CUC">Cúcuta-CUC</option>
                                    <option value="Florencia-FLA">Florencia-FLA</option>
                                    <option value="Ibagué-IBE">Ibagué-IBE</option>
                                    <option value="Leticia-LET">Leticia-LET</option>
                                    <option value="Manizales-MZL">Manizales-MZL</option>
                                    <option value="Medellín-MDE">Medellín-MDE</option>
                                    <option value="Pereira-PEI">Pereira-PEI</option>
                                </select>
                            </div>
                        </div>
                        <button class="button" formaction="/separavuelo/buscar/" formmethod="post">Buscar Vuelo</button>
                    </form>
                    <table id="myTable">
                    <tr class="header1">
                        <th style="width:30%;">No. Vuelo</th>
                        <th style="width:30%;">Aerolinea</th>
                        <th style="width:30%;">Hora</th>
                        <th style="width:30%;"> </th>
                    </tr>
                    {% for dat in vuelos %}
                        <tr>
                            <td style="width:5%;">{{dat[0]}}</td>
                            <td style="width:15%;">{{dat[1]}}</td>
                            <td style="width:15%;">{{dat[2]}}</td>
                            <td><input name="choice" type="radio" value="{{dat[0]}}"/></td>
                        </tr>
                    {% endfor %}
                    </table>
                <button class="button" id="btn" onclick="load()">Separar Cupo en este vuelo</button>
                </section>
                
        </section>
        <footer class="footer">
            <a href="/terminos">Terminos y condiciones </a>
            <a href="/contactanos">Contactanos</a>
        </footer>
        <script type="text/javascript">
            //alert("{{estado}}");
            function load() {
                //alert("buscando")
                const rbs = document.querySelectorAll('input[name="choice"]');
                let selectedValue;
                for (const rb of rbs) {
                    if (rb.checked) {
                        //alert(rb.value)
                        selectedValue = rb.value;
                        break;
                    }
                }
                document.getElementById("codigo").value = selectedValue;
                document.getElementById('formulario').submit();
                //alert(document.getElementById("codigo").value)
            }
            document.getElementById("origen").value = "{{origen}}";
            document.getElementById("destino").value = "{{destino}}";
            //document.getElementById("fechaSalida").value = ("{{fhsalida}}").spl;
        </script>
    </body>
</html>
