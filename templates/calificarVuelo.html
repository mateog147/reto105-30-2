<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Experiencia</title>
    <link rel="stylesheet" href='{{ url_for("static", filename="css/style.css") }}'>
</head>
<style>
    #form {
  width: 30px;
  margin: 0 auto;
  height: 20px;
}

#form p {
  text-align: center;
}

#form label {
  font-size: 20px;
}

input[type="radio"] {
  display: none;
}

label {
  color: grey;
  font-size: 100px;
}

.clasificacion {
  direction: rtl;
  unicode-bidi: bidi-override;
}

label:hover,
label:hover ~ label {
  color: orange;
}

input[type="radio"]:checked ~ label {
  color: orange;
}
</style>
<body>
  <header class="header">
    <img class="header__img" src='{{ url_for("static", filename="media/icons8-aeropuerto-100.png") }}' alt="Logo" />
    <div>
        <h2 class="header__title"><a href="/menu/">Aeropuerto Matecaña Internacional</a> </h2>
        <a href="/menu/">Regresar</a>
    </div> 
</header>
    <section class="login">
        <section class="login__container">  
        <form>
            <h2 class="login__title">Califica tu Vuelo</h2>
            <h2 class="errmsg">{{error}}</h2>
            <div>
            <input class="input" type="text" placeholder="Numero de Vuelo" name="codigo" value="{{codigo}}" style="width: 200px;" required/>
            <button class="button" formaction="/calificar/buscar/" formmethod="post">Buscar</button>  
            <h3 class="login__title">Origen: {{origen}}</h3>
            <h3 class="login__title">Destino: {{destino}}</h3>
            <h3 class="login__title">Hora de Salida: {{horasalida}}</h3>
            <h3 class="login__title">Hora de Llegada: {{horallegada}}</h3>
            </div>
            <h3>Evalua Tu vuelo</h3>     
                <p class="clasificacion">
                <input id="radio1" type="radio" name="estrellas" value="5"><!--
                --><label for="radio1">★</label><!--
                --><input id="radio2" type="radio" name="estrellas" value="4"><!--
                --><label for="radio2">★</label><!--
                --><input id="radio3" type="radio" name="estrellas" value="3"><!--
                --><label for="radio3">★</label><!--
                --><input id="radio4" type="radio" name="estrellas" value="2"><!--
                --><label for="radio4">★</label><!--
                --><input id="radio5" type="radio" name="estrellas" value="1"><!--
                --><label for="radio5">★</label>
                </p>
             
                <h3>Escribe un comentario</h3> 
                <input class="input" type="text" placeholder="comentarios" style="border: 2px solid white; height: 200px; background-color: white; color:black;"/>
                <button class="button" formaction="/calificar/">Enviar Evaluacion</button>
            </form>
        </section>
    </section>
    <footer class="footer">
        <a href="/terminos">Terminos y condiciones </a>
        <a href="/contactanos">Contactanos</a>
        
</body>
</html>
