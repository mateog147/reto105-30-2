<!DOCTYPE html>
<html lang="es">
    <style>
        .barra select
        {
            appearance: none;
            -webkit-appearance: none;
	        -moz-appearance: none;
            max-width: 600px;
            right: 250px;
            top: calc(60% - 45px);
            width: 250px;
            height: 20px;
            display: block;
            margin-top: 3px;
            background: rgb(220, 53, 20);
            border: none;
            border-bottom: none;
        }

    </style>
    <head>
        <meta charset="UTF-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Registro de Vuelo</title>
        <link rel="stylesheet" href='{{ url_for("static", filename="css/style.css") }}'>
    </head>

    <body>
        <header class="header">
            <img class="header__img" src="../static/media/icons8-aeropuerto-100.png" alt="Logo" /> 
            <h2 class="header__title"><a href="/home/">Aeropuerto Matecaña Internacional</a> </h2>
        </header>

        <section class="login">
            <section class="login__container">
                    <center><h2>Ingreso Vuelos Nacionales</h2></center>
                    <h2 class="errmsg">{{error}}</h2>
                    <form class="login__container--form">
                        <input class="input" type="text" name="codigo" placeholder="Codigo de Vuelo" required/>
                        <input class="input" type="text" name="empresa" placeholder="Aerolinea" required/>
                        <input class="input" type="text" name="matricula" placeholder="Matricula de la Aeronave" required/>
                        <input class="input" type="text" name="piloto" placeholder="Piloto (cedula)" required/>
                        <label for="horaSalida">Fecha y hora salida</label>
                        <div>
                            <input class="select" type="date" name="fechaSalida"  required/>
                            <input class="select" type="time" name="horaSalida"  required/>
                        </div>

                        <label>Fecha y hora llegada</label>
                        <div>
                            <input class="select" type="date" name="fechaLlegada"  required/>
                            <input class="select" type="time" name="horaLlegada"  required/>
                        </div>

                        <div class="login__select" style="display: flex;">
                            <div>
                                <span style="width: 50%;">Origen</span>
                                <select class="select" name="origen" style="width: 150px;">
                                    <option value="">-</option>
                                    <option value="Armenia">Armenia-AXM</option>
                                    <option value="Barranquilla">Barranquilla-BAQ</option>
                                    <option value="Bogotá">Bogotá-BOG</option>
                                    <option value="Bucaramanga">Bucaramanga-BGA</option>
                                    <option value="Cali">Cali-CLO</option>
                                    <option value="Cartagena">Cartagena-CTG</option>
                                    <option value="Cúcuta">Cúcuta-CUC</option>
                                    <option value="Florencia">Florencia-FLA</option>
                                    <option value="Ibagué">Ibagué-IBE</option>
                                    <option value="Leticia">Leticia-LET</option>
                                    <option value="Manizales">Manizales-MZL</option>
                                    <option value="Medellín">Medellín-MDE</option>
                                    <option value="Medellín">Pereira-PEI</option>
                                </select>
                            </div>
                            <div>
                                <span style="width: 50%;">Destino</span>
                                <select class="select" name="destino" style="width: 150px;">
                                    <option value="">-</option>
                                    <option value="Armenia">Armenia-AXM</option>
                                    <option value="Barranquilla">Barranquilla-BAQ</option>
                                    <option value="Bogotá">Bogotá-BOG</option>
                                    <option value="Bucaramanga">Bucaramanga-BGA</option>
                                    <option value="Cali">Cali-CLO</option>
                                    <option value="Cartagena">Cartagena-CTG</option>
                                    <option value="Cúcuta">Cúcuta-CUC</option>
                                    <option value="Florencia">Florencia-FLA</option>
                                    <option value="Ibagué">Ibagué-IBE</option>
                                    <option value="Leticia">Leticia-LET</option>
                                    <option value="Manizales">Manizales-MZL</option>
                                    <option value="Medellín">Medellín-MDE</option>
                                    <option value="Medellín">Pereira-PEI</option>
                                </select>
                            </div>
                        </div>
                        <button class="button" formaction="/registrovuelo/" formmethod="post">Crear Vuelo</button>
                    </form>
                </section>
        </section>
        <footer class="footer">
            <a href="/terminos">Terminos y condiciones </a>
            <a href="/contactanos">Contactanos</a>
        </footer>
    </body>
</html>
